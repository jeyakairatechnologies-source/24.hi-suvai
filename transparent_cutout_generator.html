<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hi Suvai Accurate Background Remover</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; text-align: center; }
        .canvas-card { margin: 15px; display: inline-block; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><rect width="12" height="12" fill="%23222"/><rect x="12" width="12" height="12" fill="%23333"/><rect y="12" width="12" height="12" fill="%23333"/><rect x="12" y="12" width="12" height="12" fill="%23222"/></svg>'); padding: 15px; border-radius: 12px; border: 1px solid #444; }
        canvas { max-width: 380px; height: auto; display: block; margin: 10px auto; }
        .status { font-size: 20px; color: #00e676; font-weight: bold; margin: 20px; }
        h3 { margin: 5px 0 10px 0; color: #ffca28; }
        a.dl-btn { display: inline-block; padding: 8px 16px; background: #0288d1; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Hi Suvai Product Cutout Generator (100% Alpha Transparent)</h1>
    <div id="status" class="status">Extracting pouches...</div>
    <div id="output"></div>

    <script>
        // High quality pouch extraction algorithm for photography backgrounds & checkerboards
        function processPouch(img, mode) {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            const w = canvas.width;
            const h = canvas.height;
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const isPouch = new Uint8Array(w * h);

            if (mode === 'checkerboard') {
                // Remove checkerboard (white & grey squares)
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i+1], b = data[i+2];
                    const idx = i / 4;
                    const isWhite = (r > 240 && g > 240 && b > 240);
                    const isGrey = (Math.abs(r - g) < 12 && Math.abs(g - b) < 12 && r > 160 && r < 240);
                    if (!isWhite && !isGrey) {
                        isPouch[idx] = 1;
                    }
                }
            } else if (mode === 'blue_pouch') {
                // suvai5.jpg / blue pouch:
                // Pouch is located inside bounding region: x from 0.15*w to 0.85*w, y from 0.05*h to 0.95*h
                // Blue pouch features:
                // Dark blue pouch border: B > R + 10 or (b > 60 && r < 50)
                // White label: R > 200 && G > 200 && B > 200
                // Powder window: R > 150 && G > 140 && B > 120
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const idx = y * w + x;
                        const i = idx * 4;
                        const r = data[i], g = data[i+1], b = data[i+2];

                        // Spatial constraint
                        if (x < w * 0.12 || x > w * 0.88 || y < h * 0.05 || y > h * 0.94) {
                            continue;
                        }

                        const isBlueBorder = (b > r + 15 && b > g + 5) || (b > 50 && r < 45 && g < 70);
                        const isWhiteLabel = (r > 190 && g > 190 && b > 190);
                        const isGreenBanner = (g > r + 15 && g > b + 15 && r > 80);
                        const isPowderWindow = (y > h * 0.55 && y < h * 0.76 && r > 140 && g > 130 && b > 110 && Math.abs(r - g) < 30);
                        const isDarkBlueBase = (y > h * 0.70 && b > 40 && r < 50);

                        if (isBlueBorder || isWhiteLabel || isGreenBanner || isPowderWindow || isDarkBlueBase) {
                            isPouch[idx] = 1;
                        }
                    }
                }
            } else if (mode === 'pink_pouch') {
                // suvai3.jpg / pink pouch
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const idx = y * w + x;
                        const i = idx * 4;
                        const r = data[i], g = data[i+1], b = data[i+2];

                        if (x < w * 0.11 || x > w * 0.89 || y < h * 0.08 || y > h * 0.93) continue;

                        const isPinkBorder = (r > 180 && b > 140 && g < 170 && r > g + 30);
                        const isWhiteLabel = (r > 200 && g > 200 && b > 200);
                        const isRedBanner = (r > 160 && g < 80 && b < 80);

                        if (isPinkBorder || isWhiteLabel || isRedBanner) {
                            isPouch[idx] = 1;
                        }
                    }
                }
            } else if (mode === 'darkred_pouch') {
                // suvai6.jpg / dark red pouch
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const idx = y * w + x;
                        const i = idx * 4;
                        const r = data[i], g = data[i+1], b = data[i+2];

                        if (x < w * 0.12 || x > w * 0.88 || y < h * 0.06 || y > h * 0.94) continue;

                        const isRedBorder = (r > 100 && r > g + 30 && r > b + 30);
                        const isWhiteLabel = (r > 190 && g > 190 && b > 190);
                        const isPowderWindow = (y > h * 0.55 && y < h * 0.76 && r > 140 && g > 130 && b > 110);

                        if (isRedBorder || isWhiteLabel || isPowderWindow) {
                            isPouch[idx] = 1;
                        }
                    }
                }
            }

            // Morphological closing / hole filling
            // Flood fill background from 4 corners
            const visited = new Uint8Array(w * h);
            const queue = [];

            for (let x = 0; x < w; x++) {
                if (!isPouch[x]) queue.push(x);
                if (!isPouch[(h-1)*w + x]) queue.push((h-1)*w + x);
            }
            for (let y = 0; y < h; y++) {
                if (!isPouch[y*w]) queue.push(y*w);
                if (!isPouch[y*w + (w-1)]) queue.push(y*w + (w-1));
            }

            while (queue.length > 0) {
                const curr = queue.pop();
                if (visited[curr]) continue;
                visited[curr] = 1;

                const cx = curr % w;
                const cy = Math.floor(curr / w);

                const neighbors = [
                    cy > 0 ? (cy-1)*w + cx : -1,
                    cy < h-1 ? (cy+1)*w + cx : -1,
                    cx > 0 ? cy*w + (cx-1) : -1,
                    cx < w-1 ? cy*w + (cx+1) : -1
                ];

                for (const n of neighbors) {
                    if (n >= 0 && !visited[n] && !isPouch[n]) {
                        queue.push(n);
                    }
                }
            }

            // Set alpha to 0 for all background pixels
            for (let i = 0; i < visited.length; i++) {
                if (visited[i]) {
                    data[i * 4 + 3] = 0; // 100% transparent
                }
            }

            ctx.putImageData(imgData, 0, 0);

            // Crop tightly
            let minX = w, maxX = 0, minY = h, maxY = 0;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (data[(y * w + x) * 4 + 3] > 0) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            const pad = 4;
            minX = Math.max(0, minX - pad);
            maxX = Math.min(w, maxX + pad);
            minY = Math.max(0, minY - pad);
            maxY = Math.min(h, maxY + pad);

            const cropW = Math.max(10, maxX - minX);
            const cropH = Math.max(10, maxY - minY);

            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = cropW;
            cropCanvas.height = cropH;
            const cropCtx = cropCanvas.getContext('2d');
            cropCtx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

            return cropCanvas;
        }

        async function processItem(src, name, mode) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    const canvas = processPouch(img, mode);
                    const dataUrl = canvas.toDataURL('image/png');

                    const container = document.createElement('div');
                    container.className = 'canvas-card';
                    container.innerHTML = `<h3>${name}</h3>`;
                    container.appendChild(canvas);

                    const dl = document.createElement('a');
                    dl.className = 'dl-btn';
                    dl.href = dataUrl;
                    dl.download = name.toLowerCase().replace(/[^a-z0-9]/g, '-') + '.png';
                    dl.innerText = 'Download PNG';
                    container.appendChild(dl);

                    document.getElementById('output').appendChild(container);
                    resolve({ name, dataUrl });
                };
                img.src = src;
            });
        }

        async function run() {
            document.getElementById('status').innerText = "Processing Hi Suvai pouches...";
            await processItem('suvai5.jpg', 'Hi Suvai Blue Pouch Cutout', 'blue_pouch');
            await processItem('suvai4.jpg', 'Hi Suvai Red Pouch Cutout', 'checkerboard');
            await processItem('suvai3.jpg', 'Hi Suvai Pink Pouch Cutout', 'pink_pouch');
            await processItem('suvai6.jpg', 'Hi Suvai Dark Red Pouch Cutout', 'darkred_pouch');
            document.getElementById('status').innerText = "All Hi Suvai pouch cutouts generated with 100% transparent alpha backgrounds!";
        }

        run();
    </script>
</body>
</html>
